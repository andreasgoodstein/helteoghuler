services:
  database:
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    image: mongo:7
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - helteoghuler:/data/db

  server:
    build:
      dockerfile: ./Server.Dockerfile
      args:
        - DATABASE__CONNECTIONSTRING=mongodb://root:password@database:27017
        - DATABASE__DATABASENAME=HelteOgHulerDatabase
    depends_on:
      - database
    image: helteoghulerserver
    ports:
      - 7111:80

volumes:
  helteoghuler:
